[project]
name = "modern-data-stack-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "karthik569", email = "sahukarikarteek@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "faker>=30.0.0",
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
    "dagster>=1.8.0",
    "dagster-duckdb>=0.24.0",
    "dagster-dbt>=0.24.0",
]

[project.scripts]
modern-data-stack-lab = "modern_data_stack_lab:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
